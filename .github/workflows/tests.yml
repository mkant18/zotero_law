name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: All tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out pinned Zotero sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zotero/zotero
          ref: 44fe83d98bcf9b982b74782dcc5f824c8ab9cb43
          path: zotero
          persist-credentials: false
      - name: Check out pinned Zotero utilities
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zotero/utilities
          ref: 4051881d59c6c12d34417d4c226f37218051be90
          path: utilities
          persist-credentials: false
      - name: Check out pinned CSL locales
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: citation-style-language/locales
          ref: a89adece41013402236e2c9020972d7e931fbab8
          path: westlaw-us/.cache/csl-locales
          persist-credentials: false
      - name: Install XML validator
        run: python -m pip install lxml==6.1.2
      - name: Run every test suite
        run: python scripts/test.py
